# /etc/nginx/sites-available/jcspace.conf
# Static site from /var/www/jcspace/site, admin + API proxied to the Node service on 127.0.0.1:3100.
# Replace jcspace.example with the real domain. TLS paths assume certbot (see DEPLOY.md).

limit_req_zone $binary_remote_addr zone=jc_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=jc_api:10m rate=120r/m;
limit_req_status 429;

map $uri $jc_cache {
    default                         "no-cache";
    ~*\.(css|js)$                   "public, max-age=31536000, immutable";   # versioned with ?v=
    ~*\.(woff2|webp|jpg|jpeg|png|svg|ico|ktx2)$ "public, max-age=2592000";
}

server {
    listen 80;
    listen [::]:80;
    server_name jcspace.example www.jcspace.example;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://jcspace.example$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jcspace.example;

    ssl_certificate     /etc/letsencrypt/live/jcspace.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jcspace.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root  /var/www/jcspace/site;
    index index.html;
    charset utf-8;
    client_max_body_size 9m;            # image uploads are capped at 8 MB in the app

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $jc_cache;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # never serve internals if they end up in the web root
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(tmp|bak|md)$  { deny all; }
    location ^~ /server/ { deny all; }          # admin source, if the repo is checked out as the web root

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache"; }

    # admin UI + API -> Node
    location = /admin { return 301 /admin/; }
    location /admin/ {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/jc-proxy.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /api/login {
        limit_req zone=jc_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/jc-proxy.conf;
    }
    location /api/ {
        limit_req zone=jc_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/jc-proxy.conf;
    }
}
